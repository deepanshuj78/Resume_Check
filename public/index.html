<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Checker</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: radial-gradient(circle at top, #334155, #0f172a 55%);
      }

      main {
        width: min(36rem, calc(100% - 3rem));
        padding: 3rem;
        border: 1px solid #475569;
        border-radius: 1.5rem;
        background: rgb(15 23 42 / 82%);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
      }

      p {
        margin: 0;
        color: #cbd5e1;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      code {
        color: #f9a8d4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Resume Checker</h1>
      <p>
        This project contains a Streamlit application. Run it in a Python
        environment with <code>streamlit run app.py</code>.
      </p>
    </main>
  </body>
</html>
